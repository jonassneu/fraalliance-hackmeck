<!doctype html><html><head><meta charset="utf-8"><style>
/* README hero: now vs the hackathon version on the hackathon's own test weeks, 15 Sep - 30 Oct 2026.
   Now and prognosis: experiments/integration/final_eval_od.csv (legacy_part); hackathon: experiments/eval_long/REPORT.md.
   Rendered to accuracy.png (light) and accuracy-dark.png (open with #dark) at 960 x 408, device scale 2. */
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
:root{--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b;--grid:rgba(0,0,0,.08);--accent:#0071e3;--prog:#8e8e93;--rules:#c7c7cc}
html.dark{--ink:#f0f0f2;--ink2:#a1a1a6;--ink3:#86868b;--grid:rgba(255,255,255,.10);--accent:#4c9dff;--prog:#8e8e93;--rules:#5a5a5f}
body{width:960px;height:408px;padding:24px 24px 16px;font-family:"Noto Sans",system-ui,sans-serif;color:var(--ink);
  font-variant-numeric:tabular-nums}
h1{font-size:20px;font-weight:500;line-height:28px}
p{font-size:15px;line-height:20px;color:var(--ink2)}
svg{display:block;margin-top:12px;overflow:visible}
.tick{font:400 15px "Noto Sans Mono",ui-monospace,monospace;fill:var(--ink3)}
.lead{font:400 15px "Noto Sans",system-ui,sans-serif;fill:var(--ink3)}
.val{font:500 24px "Noto Sans",system-ui,sans-serif;fill:var(--accent)}
.hv{font:400 16px "Noto Sans",system-ui,sans-serif;fill:var(--ink2)}
.name{font:400 17px "Noto Sans",system-ui,sans-serif;fill:var(--ink2)}
.name.us{fill:var(--ink);font-weight:500}
</style></head><body>
<h1>Now vs the hackathon version</h1>
<p>Share of hours with the right operating direction, on the hackathon's test weeks, 15 Sep – 30 Oct 2026</p>
<svg id="c" width="912" height="300"></svg>
<script>
if (location.hash == '#dark') document.documentElement.classList.add('dark');
const leads = ['1 h ahead', '6 h', '24 h', '48 h'];
const series = [
  {name: 'Published prognosis', cls: 'rules', v: [95.1, 93.7, 92.0, 89.8]},
  {name: 'Hackathon (v1.0)', cls: 'prog', v: [96.9, 96.1, 95.4, 93.1]},
  {name: 'Now', cls: 'us', v: [97.2, 96.3, 95.7, 95.2]},
];
const X0 = 48, X1 = 660, Y0 = 36, Y1 = 284, LO = 88, HI = 98;
const x = i => X0 + 40 + i * (X1 - X0 - 40) / 3, y = v => Y1 - (v - LO) / (HI - LO) * (Y1 - Y0);
const color = {rules: 'var(--rules)', prog: 'var(--prog)', us: 'var(--accent)'};
let s = '';
for (let g = 88; g <= 98; g += 2)
  s += `<line x1="${X0}" x2="${X1}" y1="${y(g)}" y2="${y(g)}" stroke="var(--grid)"/>` +
       `<text class="tick" x="${X0 - 12}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
leads.forEach((l, i) => s += `<text class="lead" x="${x(i)}" y="${Y1 + 28}" text-anchor="middle">${l}</text>`);
for (const se of series) {
  const us = se.cls == 'us', c = color[se.cls];
  s += `<polyline fill="none" stroke="${c}" stroke-width="${us ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round"
        points="${se.v.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>`;
  se.v.forEach((v, i) => s += `<circle cx="${x(i)}" cy="${y(v)}" r="${us ? 5 : 3.5}" fill="${c}"/>`);
  if (us) se.v.forEach((v, i) => s += `<text class="val" x="${x(i)}" y="${y(v) - 16}" text-anchor="middle">${v.toFixed(1)} %</text>`);
  if (se.cls == 'prog') se.v.forEach((v, i) => s += `<text class="hv" x="${x(i)}" y="${y(v) + 28}" text-anchor="middle">${v.toFixed(1)} %</text>`);
  const ly = y(se.v[3]);
  s += `<text class="name${us ? ' us' : ''}" x="${X1 + 20}" y="${ly + 5}">${se.name}</text>`;
}
c.innerHTML = s;
</script></body></html>
