    <rect class="rwy" x="4" y="26" width="56" height="12" rx="3" stroke="none"/>
    <rect class="mark" x="17" y="31" width="7" height="2" rx="1" stroke="none"/>
    <rect class="mark" x="28.5" y="31" width="7" height="2" rx="1" stroke="none"/>
    <rect class="mark" x="40" y="31" width="7" height="2" rx="1" stroke="none"/>
    <path d="M52 14 H12 M19 7 L12 14 L19 21" stroke="#2a78d6"/>
    <path d="M12 50 H52 M45 43 L52 50 L45 57" stroke="#eda100"/>
  </g>
</svg>
