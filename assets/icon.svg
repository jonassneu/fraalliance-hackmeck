<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>.rwy{fill:#3a3a3c}.mark{fill:#fff}@media (prefers-color-scheme:dark){.rwy{fill:#d2d2d7}.mark{fill:#1d1d1f}}</style>
  <!-- One runway on its real heading (070 / 250) with both operating directions: westbound blue (OD 25), eastbound amber (OD 07) -->
