name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      - name: Byte-compile all modules
        run: uv run python -m compileall -q fra experiments tests
      - name: Unit tests
        run: uv run pytest -q
