name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      - name: Byte-compile all modules
        run: uv run python -m compileall -q fra experiments tests
      - name: Unit tests
        run: uv run pytest -q
